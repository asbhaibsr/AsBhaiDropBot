<style>
/* ── AsBhai Verify Strip ── */
#asb-verify-strip {
  position: fixed;
  bottom: -160px;
  left: 0;
  right: 0;
  z-index: 999999;
  font-family: 'Segoe UI', Arial, sans-serif;
  transition: bottom 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
}
#asb-verify-strip.show {
  bottom: 0;
}
#asb-strip-inner {
  background: linear-gradient(135deg, #0f0f1a 0%, #1a1a2e 100%);
  border-top: 2px solid #e94560;
  box-shadow: 0 -6px 30px rgba(233, 69, 96, 0.4);
  padding: 14px 16px 20px;
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
}
#asb-strip-left {
  display: flex;
  align-items: center;
  gap: 10px;
  flex: 1;
  min-width: 0;
}
#asb-strip-icon {
  font-size: 28px;
  flex-shrink: 0;
  animation: asb-bounce 1.5s infinite;
}
@keyframes asb-bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-4px); }
}
#asb-strip-text {
  min-width: 0;
}
#asb-strip-title {
  color: #fff;
  font-size: 13px;
  font-weight: 800;
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
#asb-strip-sub {
  color: #aaa;
  font-size: 11px;
  margin-top: 2px;
  line-height: 1.3;
}
#asb-strip-timer {
  color: #f5a623;
  font-size: 10px;
  font-weight: 700;
  margin-top: 3px;
}
#asb-get-btn {
  background: linear-gradient(135deg, #e94560, #f5a623);
  color: #fff !important;
  text-decoration: none !important;
  padding: 11px 18px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 800;
  white-space: nowrap;
  box-shadow: 0 4px 16px rgba(233, 69, 96, 0.5);
  flex-shrink: 0;
  transition: transform 0.15s, box-shadow 0.15s;
  display: block;
  text-align: center;
}
#asb-get-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(233, 69, 96, 0.65);
}
#asb-get-btn:active {
  transform: translateY(0);
}
#asb-strip-close {
  position: absolute;
  top: 8px;
  right: 10px;
  background: rgba(255,255,255,0.08);
  border: none;
  color: #666;
  font-size: 14px;
  cursor: pointer;
  border-radius: 50%;
  width: 22px;
  height: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
/* Progress bar on strip */
#asb-strip-progress {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  background: linear-gradient(90deg, #e94560, #f5a623);
  transition: width 1s linear;
  width: 0%;
}
/* Countdown overlay before strip shows */
#asb-countdown-badge {
  position: fixed;
  bottom: 20px;
  right: 16px;
  z-index: 999998;
  background: rgba(0,0,0,0.75);
  color: #fff;
  border-radius: 20px;
  padding: 8px 14px;
  font-size: 12px;
  font-family: 'Segoe UI', Arial, sans-serif;
  backdrop-filter: blur(6px);
  border: 1px solid rgba(233,69,96,0.3);
  display: none;
  align-items: center;
  gap: 6px;
  box-shadow: 0 2px 12px rgba(0,0,0,0.4);
  animation: asb-fade-in 0.5s ease;
}
@keyframes asb-fade-in {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
#asb-countdown-badge.show {
  display: flex;
}
#asb-badge-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: #e94560;
  animation: asb-pulse 1s infinite;
}
@keyframes asb-pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.7); }
}
</style>

<!-- Strip HTML — body mein inject hoga via JS -->
<script>
(function () {
  // ── URL params read karo ──
  var p = new URLSearchParams(window.location.search);
  var uid   = p.get('uid');
  var token = p.get('token');
  var bot   = p.get('bot');
  var sl    = p.get('sl') || 'blogger';

  // Normal visitors = kuch nahi
  if (!uid || !token || !bot) return;

  // ── Final verify link ──
  var tgLink = 'https://t.me/' + bot + '?start=sv_' + uid + '_' + token + '_' + sl;

  // ── Timing settings ──
  var WAIT_SEC = 35;    // kitne second baad strip dikhe
  var BADGE_AT = 5;     // kitne second baad countdown badge dikhe

  // ── Badge inject karo ──
  var badge = document.createElement('div');
  badge.id = 'asb-countdown-badge';
  badge.innerHTML = '<div id="asb-badge-dot"></div><span id="asb-badge-txt">File ' + WAIT_SEC + ' sec mein</span>';
  document.body.appendChild(badge);

  // ── Strip inject karo ──
  var strip = document.createElement('div');
  strip.id = 'asb-verify-strip';
  strip.innerHTML = [
    '<div id="asb-strip-progress"></div>',
    '<div id="asb-strip-inner">',
    '  <div id="asb-strip-left">',
    '    <div id="asb-strip-icon">🎬</div>',
    '    <div id="asb-strip-text">',
    '      <div id="asb-strip-title">File Ready! Verify karo</div>',
    '      <div id="asb-strip-sub">Telegram mein seedha file aayegi 📥</div>',
    '      <div id="asb-strip-timer">⏳ Thoda wait karo...</div>',
    '    </div>',
    '  </div>',
    '  <a id="asb-get-btn" href="' + tgLink + '" target="_blank">✅ Get File</a>',
    '</div>',
    '<button id="asb-strip-close" onclick="document.getElementById(\'asb-verify-strip\').style.display=\'none\'">✕</button>'
  ].join('');
  document.body.appendChild(strip);

  var progBar  = document.getElementById('asb-strip-progress');
  var timerTxt = document.getElementById('asb-strip-timer');
  var badgeTxt = document.getElementById('asb-badge-txt');
  var elapsed  = 0;

  // ── Badge 5 sec baad dikhao ──
  setTimeout(function () {
    badge.classList.add('show');
  }, BADGE_AT * 1000);

  // ── Main countdown ──
  var interval = setInterval(function () {
    elapsed++;
    var rem = WAIT_SEC - elapsed;
    var pct = (elapsed / WAIT_SEC) * 100;

    // Progress bar update
    if (progBar) progBar.style.width = Math.min(pct, 100) + '%';

    // Badge text update
    if (badgeTxt && rem > 0) {
      badgeTxt.textContent = 'File ' + rem + ' sec mein';
    }

    // Strip show karo
    if (elapsed >= WAIT_SEC) {
      clearInterval(interval);

      // Badge hide
      badge.classList.remove('show');
      setTimeout(function () { badge.style.display = 'none'; }, 500);

      // Timer text update
      if (timerTxt) timerTxt.textContent = '✅ Ab Get File dabao!';
      if (progBar)  progBar.style.background = '#4ade80';

      // Strip slide up
      strip.classList.add('show');

      // Get File button pulse animation
      var btn = document.getElementById('asb-get-btn');
      if (btn) {
        btn.style.animation = 'asb-bounce 0.8s infinite';
      }
    } else {
      // Timer countdown in strip (agar already visible ho)
      if (timerTxt) timerTxt.textContent = '⏳ ' + rem + ' sec mein file button aayega...';
    }
  }, 1000);

  // ── Get File click handler ──
  var getBtn = document.getElementById('asb-get-btn');
  if (getBtn) {
    getBtn.addEventListener('click', function () {
      getBtn.textContent = '✅ Opening Bot...';
      getBtn.style.background = '#4ade80';
      getBtn.style.color = '#000';
      // Strip 3 sec baad hide
      setTimeout(function () {
        strip.style.bottom = '-160px';
      }, 3000);
    });
  }

})();
</script>
